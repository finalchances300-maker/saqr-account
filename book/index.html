<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتاب اللعبة | صقار الخليج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120C08; --card:#1E150E; --gold:#C9A227; --gold2:#F3D774; --text:#EFE6D2; --muted:#B8A88C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#2A1D12 0%,var(--bg) 65%); color:var(--text);
         font-family:"El Messiri",system-ui,sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { max-width:520px; width:100%; text-align:center; background:var(--card); border:1px solid var(--gold); border-radius:20px; padding:36px 24px; }
  h1 { color:var(--gold2); font-size:32px; margin:12px 0 4px; }
  .en h1 { font-family:"Cinzel",serif; font-size:26px; }
  p { color:var(--muted); font-size:18px; line-height:1.7; margin:8px 0; }
  .book { font-size:64px; }
  .switch { margin-top:22px; }
  .switch a { color:var(--gold); text-decoration:none; border:1px solid var(--gold); border-radius:999px; padding:6px 16px; font-size:15px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="book">📖</div>
    <h1 id="t"></h1>
    <p id="s"></p>
    <div class="switch"><a href="#" id="sw"></a></div>
  </div>
<script>
  var T = {
    ar: { t:"كتاب صقار الخليج", s:"هنا ستجد شرح كل أنظمة اللعبة بالأرقام والصور: الصقور، التزاوج والطفرات، التدريب، السباقات، المقناص، السوق وغيرها. الكتاب قيد الإعداد، ارجع قريبًا.", sw:"English", dir:"rtl" },
    en: { t:"The Saqar Alkhaleej Book", s:"Every system of the game, explained with exact numbers and pictures: falcons, breeding and mutations, training, races, hunting, the market and more. The book is being written — come back soon.", sw:"العربية", dir:"ltr" }
  };
  function show(l) {
    var x = T[l] || T.ar; document.documentElement.lang = l; document.documentElement.dir = x.dir;
    document.getElementById("card").className = "card " + l;
    document.getElementById("t").textContent = x.t; document.getElementById("s").textContent = x.s; document.getElementById("sw").textContent = x.sw;
    document.title = x.t;
  }
  var lang = location.hash === "#en" ? "en" : "ar"; show(lang);
  document.getElementById("sw").onclick = function (e) { e.preventDefault(); lang = lang === "ar" ? "en" : "ar"; history.replaceState(null, "", "#" + lang); show(lang); };
</script>
</body>
</html>
